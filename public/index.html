<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masked Spire</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kreon:wght@400;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
html, body { margin: 0; }
*, *::before, *::after { box-sizing: border-box; }
/* Layout: one centered column; top bar, then the active screen. Battle = stage (hero left, enemies right), controls row, hand. Single committed dark look from the Spire Vibes art. */
:root {
  color-scheme: dark;
  --bg: #121016;
  --panel: #1D1924;
  --panel2: #29223A;
  --line: #463C54;
  --ink: #F6EEE2;
  --muted: #D2C8B8;
  --faint: #A89E8E;
  --teal: #5FE6E2;
  --gold: #E8BE52;
  --blood: #E04A5E;
  --skill: #4FA8D0;
  --power: #D8A838;
  --status: #8A8296;
  --atk-bg: #3A141C; --atk-fg: #FF9A9A;
  --def-bg: #142A3E; --def-fg: #A8D8FF;
  --buf-bg: #3A2C10; --buf-fg: #F6D27A;
  --deb-bg: #2A1840; --deb-fg: #D8B4FF;
  --display: 'Kreon', Georgia, serif;
  --body: 'Alegreya Sans', 'Trebuchet MS', sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
#app { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h2 { font-size: 28px; } h3 { font-size: 21px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.btn { font-family: var(--display); font-weight: 700; font-size: 18px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 20px; min-height: 48px; cursor: pointer; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--gold); color: #1A1208; border-color: var(--gold); }
.btn.primary:hover { background: #F6D070; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.spacer { flex: 1; }

/* Top bar */
.topbar { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding: 10px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 18px; }
.topbar .name { font-family: var(--display); font-weight: 700; font-size: 21px; }
.stat { display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; font-weight: 700; }
.stat svg { width: 20px; height: 20px; }
.relics { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 14px; padding: 3px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }

/* Cards */
.card { --c: var(--status); position: relative; flex: 0 0 auto; width: 156px; min-height: 206px; display: flex; flex-direction: column; gap: 6px; padding: 14px 12px 12px; background: var(--panel2); border: 3px solid var(--c); border-radius: 12px; text-align: left; cursor: pointer; transition: transform .12s ease; }
.card::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: var(--c); border-radius: 8px 8px 0 0; opacity: .5; }
.card:hover { transform: translateY(-8px); }
.card.sel { transform: translateY(-16px); box-shadow: 0 0 0 4px var(--teal), 0 10px 24px #0008; }
.card.dim { opacity: .5; }
.card .cost { position: absolute; top: -13px; left: -13px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 3px solid var(--c); font-family: var(--display); font-weight: 700; font-size: 20px; }
.card .ctype { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); font-weight: 700; }
.card .cname { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.1; }
.card .cdesc { font-size: 16px; line-height: 1.35; }
.card .live { display: block; margin-top: 4px; color: var(--teal); font-weight: 700; }
.card .ctype { padding-left: 20px; padding-right: 14px; }
.card .rgem { position: absolute; top: 10px; right: 10px; width: 12px; height: 12px; transform: rotate(45deg); border: 2px solid #120C10; }
.card .rgem.r-u { background: #6FB4FF; box-shadow: 0 0 8px #6FB4FF; }
.card .rgem.r-r { background: #E8BE52; box-shadow: 0 0 10px #E8BE52; }
.card.rar-r { background: linear-gradient(180deg, #3A2E22 0%, var(--panel2) 55%); }
.card .rlabel { color: var(--muted); font-weight: 700; }
.card.rar-u .rlabel { color: #9CCBFF; } .card.rar-r .rlabel { color: var(--gold); }
.card .price { margin-top: auto; font-family: var(--display); color: var(--gold); font-weight: 700; font-size: 18px; }
.t-attack { --c: var(--blood); } .t-skill { --c: var(--skill); } .t-power { --c: var(--power); } .t-status { --c: var(--status); }
.cards { display: flex; flex-wrap: wrap; gap: 20px; padding: 14px 6px; }

/* Battle stage */
.battle { display: flex; flex-direction: column; gap: 14px; }
.stage { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: end; padding: 18px; border-radius: 12px; background: radial-gradient(ellipse at 50% 100%, #1F3A3A 0%, #15121A 70%); border: 1px solid var(--line); }
.herobox { position: relative; display: flex; flex-direction: column; gap: 10px; }
.portrait { position: relative; width: 100%; aspect-ratio: 5 / 6; max-width: 100%; border-radius: 12px; overflow: hidden; background: #1C6670; border: 2px solid #2E8E99; }
.portrait svg { width: 100%; height: 100%; display: block; }
.portrait.hurt::after { content: ""; position: absolute; inset: 0; background: #E04A5E; opacity: 0; animation: flash .4s ease; }
.hname { font-family: var(--display); font-weight: 700; font-size: 22px; }
.hpline { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hpbar { position: relative; flex: 1; height: 16px; background: #3A1820; border-radius: 8px; overflow: hidden; border: 1px solid #5A2A34; }
.hpbar > i { display: block; height: 100%; background: linear-gradient(#F0606E, #B8303E); }
.shield { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 2px 6px; border-radius: 999px; background: var(--def-bg); color: var(--def-fg); border: 1px solid #3A6A9A; font-weight: 700; font-size: 17px; }
.shield svg { width: 18px; height: 18px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 17px; font-weight: 700; color: var(--teal); }
.flow i { width: 13px; height: 13px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 14px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
.badge.bad { background: var(--deb-bg); color: var(--deb-fg); border-color: #6A4A9A; }
.badge.good { background: var(--buf-bg); color: var(--buf-fg); border-color: #8A6A20; }

.enemies { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: flex-end; }
.enemy { position: relative; width: 236px; display: flex; flex-direction: column; padding: 0; overflow: visible; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; text-align: left; cursor: default; }
.enemy.boss { width: 320px; }
.enemy.threat { border-color: #8A3040; }
.enemy.target { cursor: pointer; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal); }
.enemy.target:hover { transform: translateY(-4px); }
.enemy.acting { z-index: 2; }
.enemy.dying { animation: die 1s ease-in var(--as, 0s) forwards; pointer-events: none; }
.intentbar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px 10px 0 0; font-weight: 700; }
.intentbar svg { width: 26px; height: 26px; flex: 0 0 auto; }
.intentbar .ival { font-family: var(--display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.intentbar .itext { font-size: 15px; line-height: 1.25; }
.enemy { position: relative; }
.pv { display: block; position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 5; width: max-content; max-width: 96%; text-align: center; pointer-events: none; padding: 2px 7px; border-radius: 6px; font-weight: 700; font-size: 13px; line-height: 1.2; background: rgba(42,34,51,.94); color: #fff; border: 1px solid rgba(255,255,255,.35); box-shadow: 0 2px 8px rgba(0,0,0,.6); }
.pv:empty { display: none; }
.pv.lethal { background: rgba(122,16,32,.95); border-color: #ff6b7d; }
.pv.safe { background: rgba(29,58,42,.95); border-color: #6fd69a; }
.k-atk { background: var(--atk-bg); color: var(--atk-fg); }
.k-def { background: var(--def-bg); color: var(--def-fg); }
.k-buf { background: var(--buf-bg); color: var(--buf-fg); }
.k-deb { background: var(--deb-bg); color: var(--deb-fg); }
.enemy .art { position: relative; height: 150px; overflow: hidden; }
.enemy.boss .art { height: 190px; }
.enemy .art svg { width: 100%; height: 100%; display: block; }
.einfo { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 7px; }
.ename { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.15; }
.then { font-size: 14px; color: var(--faint); }
.enote { font-size: 14px; color: var(--muted); line-height: 1.35; }

.float { position: absolute; left: 50%; top: 34%; z-index: 5; font-family: var(--display); font-weight: 700; font-size: 32px; color: #FF7A7A; text-shadow: 0 2px 0 #000, 0 0 10px #000; pointer-events: none; white-space: nowrap; animation: floatup .95s ease-out forwards; }
.float.block { color: var(--def-fg); font-size: 24px; }
.float.heal { color: #8AF59A; }
.float.buff { color: var(--gold); font-size: 22px; }
.float.miss { color: var(--muted); font-size: 22px; }
.float.big { animation-name: floatbig; animation-duration: 1.2s; color: #FF4A4A; }
@keyframes floatbig { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.5); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.45); } 28% { transform: translate(-50%, -6px) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }
.blockflash { position: absolute; inset: 0; z-index: 4; pointer-events: none; border-radius: inherit; background: radial-gradient(circle, rgba(140,200,255,.55), rgba(80,150,255,.15) 70%); box-shadow: inset 0 0 22px 4px rgba(150,210,255,.9); animation: blockflash .55s ease-out forwards; }
@keyframes blockflash { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
html.hc .blockflash { background: rgba(255,255,255,.35); box-shadow: inset 0 0 0 4px #fff; }
.hitflash { position: absolute; inset: 0; z-index: 4; pointer-events: none; border-radius: inherit; background: rgba(224,74,94,.45); box-shadow: inset 0 0 18px 3px rgba(255,90,110,.9); animation: blockflash .4s ease-out forwards; }
html.hc .hitflash { background: rgba(255,255,255,.2); box-shadow: inset 0 0 0 4px #ff4a5e; }
html.rm .hitflash { display: none; }
.battle.shake1 { animation: shake1 .35s linear; }
.battle.shake2 { animation: shake2 .45s linear; }
@keyframes shake1 { 10% { transform: translate(-4px, 2px); } 30% { transform: translate(4px, -2px); } 50% { transform: translate(-3px, 1px); } 70% { transform: translate(2px, -1px); } 100% { transform: none; } }
@keyframes shake2 { 10% { transform: translate(-8px, 4px); } 25% { transform: translate(8px, -4px); } 40% { transform: translate(-6px, 3px); } 60% { transform: translate(5px, -2px); } 80% { transform: translate(-2px, 1px); } 100% { transform: none; } }

.controls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.energy { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #FFE08A, #B8861E); color: #1A1208; font-family: var(--display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; border: 3px solid #5A4010; box-shadow: 0 0 14px #E8BE5266; }
.energy small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-top: -6px; }
.incoming { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.incoming .big { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 22px; }
.incoming .big svg { width: 24px; height: 24px; }
.incoming .danger { color: var(--atk-fg); }
.incoming .safe { color: #8AF59A; }
.piles { display: flex; flex-wrap: wrap; gap: 16px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { text-align: center; color: var(--teal); font-family: var(--display); font-size: 20px; min-height: 1.5em; }
.lastlog { text-align: center; color: var(--muted); font-size: 15px; min-height: 1.4em; }
.hand { display: flex; gap: 16px; overflow-x: auto; padding: 22px 16px 12px; justify-content: safe center; }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-size: 15px; color: var(--muted); }
.log summary { cursor: pointer; font-family: var(--display); color: var(--ink); font-size: 17px; }
.log ol { margin: 8px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 3px; }

.idle { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.idle.sway { animation-name: sway; animation-duration: 4s; transform-origin: 50% 0%; }
.idle.flutter { animation-name: flutter; animation-duration: 1.6s; }
@keyframes bob { 50% { transform: translateY(-3px) scale(1.015, .985); } }
@keyframes sway { 25% { transform: rotate(1.6deg); } 75% { transform: rotate(-1.6deg); } }
@keyframes flutter { 50% { transform: translateY(-4px) scaleY(.96); } }
@keyframes act { 40% { transform: translateY(14px) scale(1.05); } }
@keyframes hit { 25% { transform: translateX(-7px); filter: brightness(1.8); } 60% { transform: translateX(5px); } }
@keyframes lunge { 40% { transform: translateX(22px) rotate(2deg); } }
@keyframes hurt { 30% { transform: translateX(-9px); } 60% { transform: translateX(6px); } }
@keyframes flash { 20% { opacity: .45; } 100% { opacity: 0; } }
@keyframes die { 0%, 55% { opacity: 1; } 100% { opacity: 0; transform: translateY(10px); } }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -56px) scale(1); } }
.card.flyghost { position: fixed; margin: 0; z-index: 60; pointer-events: none; transition: none; transform-origin: 50% 50%; }
@keyframes shufpulse { 0% { transform: scale(1); } 35% { transform: scale(1.25); color: #fff; } 100% { transform: scale(1); } }
.piles span.shuf { display: inline-block; animation: shufpulse .6s ease-out; }
html.rm .piles span.shuf { animation: none; }

/* Map */
.mapcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.mapwrap { position: relative; width: 100%; max-width: 540px; margin: 0 auto; }
.mapwrap svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); border: 2px solid var(--line); color: var(--faint); cursor: not-allowed; padding: 0; }
.node svg { width: 24px; height: 24px; }
.node.avail { cursor: pointer; border-color: var(--gold); color: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
.node.done { background: #463C54; color: var(--ink); }
.node.cur { box-shadow: 0 0 0 4px var(--teal); }
.node.bossnode { width: 68px; height: 68px; border-color: #6FD0FF; }
.node.bossnode svg { width: 32px; height: 32px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px #E8BE5233; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: 16px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend svg { width: 20px; height: 20px; }

/* Panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.title { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; align-items: center; }
.title .hero { aspect-ratio: 3 / 4; max-width: 100%; border-radius: 12px; overflow: hidden; background: #1C6670; }
.title .hero svg { width: 100%; height: 100%; display: block; }
.title h1 { font-size: clamp(42px, 7vw, 76px); line-height: 1; }
.title p { max-width: 62ch; margin: 0; }
.rules { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; font-size: 17px; }
.rules li { padding-left: 14px; border-left: 3px solid var(--line); }
.overlay { position: fixed; inset: 0; background: #08060CE6; z-index: 20; overflow: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay .panel { max-width: 1040px; margin: 0 auto; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--gold); padding: 12px 20px; border-radius: 10px; z-index: 30; font-family: var(--display); font-size: 18px; }
.relicrow { display: flex; flex-direction: column; gap: 6px; }
.choices { display: flex; flex-wrap: wrap; gap: 12px; }

/* Block shields beside the characters */
.pwrap { position: relative; display: block; }
.bigshield { position: absolute; right: -14px; bottom: -14px; width: 60px; height: 68px; display: grid; place-items: center; z-index: 3; filter: drop-shadow(0 3px 6px #000B); pointer-events: none; transition: opacity .2s ease; }
.bigshield svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bigshield b { position: relative; margin-top: -6px; font-family: var(--display); font-size: 25px; color: #FFFFFF; text-shadow: 0 2px 0 #0009; font-variant-numeric: tabular-nums; }
.bigshield.empty { opacity: 0; }
.bigshield.pop { animation: spop .5s ease; }
.enemy .bigshield { right: auto; left: -16px; bottom: -16px; width: 50px; height: 57px; }
.enemy .bigshield b { font-size: 21px; }
@keyframes spop { 0% { transform: scale(.3); } 55% { transform: scale(1.3); } 100% { transform: scale(1); } }
.hpbar.blocked { border-color: #6FB8F0; box-shadow: 0 0 0 1px #6FB8F0; }
.hpbar.blocked > i { background: linear-gradient(#7CC4F6, #3A78B8); }
.orb { position: fixed; width: 14px; height: 14px; margin: -1px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFFFFF, #5FE6E2 55%, #2A8590); box-shadow: 0 0 12px #5FE6E2, 0 0 24px #5FE6E2AA; z-index: 25; pointer-events: none; }
.fwlabel { position: fixed; z-index: 26; pointer-events: none; font-family: var(--display); font-weight: 700; font-size: 24px; color: var(--teal); text-shadow: 0 2px 0 #000, 0 0 12px #000; transform: translate(-50%, -50%); animation: fwl 1.1s ease forwards; }
@keyframes fwl { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -90%); } }

@media (max-width: 860px) {
  .stage { grid-template-columns: 1fr; }
  .herobox { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .herobox .portrait { width: 120px; flex: 0 0 auto; }
  .herobox .hstats { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 8px; }
  .title { grid-template-columns: 1fr; }
  .title .hero { aspect-ratio: auto; height: 280px; }
  .controls { grid-template-columns: auto minmax(0, 1fr); }
  .controls .endwrap { grid-column: 1 / -1; display: flex; justify-content: flex-end; }
}
@media (max-width: 520px) {
  .enemy, .enemy.boss { width: 100%; max-width: 340px; }
  .card { width: 138px; }
}
.hstats { display: flex; flex-direction: column; gap: 8px; }
#app.scr-in { animation: scr-in .22s ease-out; }
@keyframes scr-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #app.scr-in { animation: none; } }
html.rm .card, html.rm .node.avail, html.rm .idle, html.rm .enemy.acting, html.rm .enemy.hit .art, html.rm .portrait.lunge, html.rm .portrait.hurt, html.rm .portrait.hurt::after { transition: none; animation: none; }
@keyframes floatfade { 0% { opacity: 0; transform: translate(-50%, 0); } 12% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }
html.rm .float, html.rm .float.big { animation-name: floatfade; animation-duration: 1.1s; animation-timing-function: linear; }
html.rm .battle.shake1, html.rm .battle.shake2 { animation: none; }

/* Hero resources and hero select */
.rage { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 17px; font-weight: 700; color: #FF9A7A; }
.rage i { width: 11px; height: 11px; transform: rotate(45deg); background: #FF6A3A; box-shadow: 0 0 8px #FF6A3A; }
.shellhint { font-size: 15px; font-weight: 700; color: var(--def-fg); }

/* ---------- Puppet rig animation ----------
   --dir: -1 for enemies (face left), 1 for heroes (face right). --f: sign for "swing toward the front".
   Idle loops use periods of 3.2s / 1.6s / .8s so they stay in phase across re-renders (--id is a shared negative delay).
   --as resumes a one-shot state animation mid-way when the page redraws. */
.rg { overflow: visible; --dir: -1; --f: 1; --e: cubic-bezier(.3, 0, .2, 1); }
.rg.hr { --dir: 1; --f: -1; }
.rg .pt-wingB { --w: -1; }
.rg .rgw, .rg .pt { transform-box: view-box; transform-origin: var(--o); }
.rg .rgfx .fx { display: none; opacity: 0; transform-box: fill-box; transform-origin: center; }
.rg .rgfx .fx-burst path { opacity: 0; transform-box: view-box; }
.rg .ghost { opacity: 0; transform-box: fill-box; transform-origin: center; }
.rg.s-phase .ghost { animation: rg-ghost 1.3s ease-in var(--as, 0s) both; }
@keyframes rg-ghost { 0% { opacity: 1; transform: none; } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--gx), var(--gy)) rotate(var(--gr)) scale(.6); } }

.rg .pt-body { --i: ri-body 3.2s ease-in-out var(--id, 0s) infinite; animation: var(--i); }
.rg .pt-head { --i: ri-head 3.2s ease-in-out var(--id, 0s) infinite; animation: var(--i); }
.rg .pt-jaw { --i: ri-jaw 3.2s ease-in-out var(--id, 0s) infinite; animation: var(--i); }
.rg .pt-armF { --i: ri-armF 3.2s ease-in-out var(--id, 0s) infinite; animation: var(--i); }
.rg .pt-armB { --i: ri-armB 3.2s ease-in-out var(--id, 0s) infinite; animation: var(--i); }
.rg .pt-wep { --i: ri-wep 3.2s ease-in-out var(--id, 0s) infinite; animation: var(--i); }
.rg .pt-tail { --i: ri-tail 1.6s ease-in-out var(--id, 0s) infinite; animation: var(--i); }
.rg .pt-wing { --i: ri-wing 1.6s ease-in-out var(--id, 0s) infinite; animation: var(--i); }
.rg .pt-aura { --i: ri-aura 3.2s ease-in-out var(--id, 0s) infinite; animation: var(--i); }
.rg .rgw.fl-f { animation: ri-float 1.6s ease-in-out var(--id, 0s) infinite; }
.rg .rgw.fl-s { animation: ri-sway 3.2s ease-in-out var(--id, 0s) infinite; }
.rg .rgw.fl-f .pt-wing { --i: ri-flap .8s ease-in-out var(--id, 0s) infinite; }
.rg .rgw.fl-h { animation: ri-float 3.2s ease-in-out var(--id, 0s) infinite; }
@keyframes ri-body { 50% { transform: scale(1.012, 1.032); } }
@keyframes ri-head { 50% { transform: translateY(-1.4px) rotate(calc(var(--f) * -1.6deg)); } }
@keyframes ri-jaw { 30%, 60% { transform: rotate(calc(var(--f) * -3deg)); } }
@keyframes ri-armF { 50% { transform: rotate(calc(var(--f) * -3deg)); } }
@keyframes ri-armB { 50% { transform: rotate(calc(var(--f) * 3deg)); } }
@keyframes ri-wep { 50% { transform: rotate(calc(var(--f) * 2.4deg)); } }
@keyframes ri-tail { 50% { transform: rotate(calc(var(--f) * -9deg)); } }
@keyframes ri-wing { 50% { transform: rotate(calc(var(--f) * var(--w, 1) * -4deg)) scaleY(.96); } }
@keyframes ri-flap { 50% { transform: rotate(calc(var(--f) * var(--w, 1) * -16deg)) scaleY(.82); } }
@keyframes ri-aura { 50% { transform: scale(1.07); opacity: .7; } }
@keyframes ri-float { 50% { transform: translateY(-4px); } }
@keyframes ri-sway { 25% { transform: rotate(1.6deg); } 75% { transform: rotate(-1.6deg); } }

/* gear-like parts spin; tendrils and big limbs sway wide; halos turn */
.rg.gear .pt-armF { --i: ri-spin 3.2s linear var(--id, 0s) infinite; }
.rg.gear .pt-armB { --i: ri-spinr 3.2s linear var(--id, 0s) infinite; }
.rg.spinw .pt-wing { --i: ri-spin 3.2s linear var(--id, 0s) infinite; }
.rg.big .pt-armF { --i: ri-bigF 3.2s ease-in-out var(--id, 0s) infinite; }
.rg.big .pt-armB { --i: ri-bigB 3.2s ease-in-out var(--id, 0s) infinite; }
.rg.gear .pt-armF, .rg.gear .pt-armB, .rg.spinw .pt-wing, .rg.big .pt-armF, .rg.big .pt-armB { animation: var(--i); }
.rg.p2.gear .pt-armF { --i: ri-spin 1.6s linear var(--id, 0s) infinite; }
.rg.p2.gear .pt-armB { --i: ri-spinr 1.6s linear var(--id, 0s) infinite; }
@keyframes ri-spin { to { transform: rotate(360deg); } }
@keyframes ri-spinr { to { transform: rotate(-360deg); } }
@keyframes ri-bigF { 25% { transform: rotate(8deg); } 75% { transform: rotate(-8deg); } }
@keyframes ri-bigB { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
/* ----- attack ----- */
.rg.s-atk .rgw { animation: rg-lunge .75s var(--e) var(--as, 0s) both; }
.rg.s-atk .pt-head { animation: var(--i), rg-a-head .75s var(--e) var(--as, 0s) both; }
.rg.s-atk .pt-armF { animation: var(--i), rg-a-armF .75s var(--e) var(--as, 0s) both; }
.rg.s-atk .pt-armB { animation: var(--i), rg-a-armB .75s var(--e) var(--as, 0s) both; }
.rg.s-atk .pt-wep { animation: var(--i), rg-a-wep .75s var(--e) var(--as, 0s) both; }
.rg.s-atk .pt-jaw { animation: var(--i), rg-a-jaw .75s var(--e) var(--as, 0s) both; }
.rg.s-atk .pt-tail { animation: var(--i), rg-a-tail .75s var(--e) var(--as, 0s) both; }
.rg.s-atk .pt-wing { animation: var(--i), rg-a-wing .75s var(--e) var(--as, 0s) both; }
.rg.s-atk .pt-body { animation: var(--i), rg-a-body .75s var(--e) var(--as, 0s) both; }
@keyframes rg-lunge { 0% { transform: none; } 28% { transform: translate(calc(var(--dir) * -7px), 1px); } 48% { transform: translate(calc(var(--dir) * 20px), 0) scale(1.05); } 100% { transform: none; } }
@keyframes rg-a-head { 28% { transform: translateY(2px) rotate(calc(var(--f) * -9deg)); } 48% { transform: translateY(1px) rotate(calc(var(--f) * 11deg)); } }
@keyframes rg-a-armF { 28% { transform: rotate(calc(var(--f) * -62deg)); } 48% { transform: rotate(calc(var(--f) * 78deg)); } 70% { transform: rotate(calc(var(--f) * 30deg)); } }
@keyframes rg-a-armB { 28% { transform: rotate(calc(var(--f) * 24deg)); } 48% { transform: rotate(calc(var(--f) * -40deg)); } }
@keyframes rg-a-wep { 28% { transform: rotate(calc(var(--f) * -72deg)); } 48% { transform: rotate(calc(var(--f) * 92deg)); } 75% { transform: rotate(calc(var(--f) * 40deg)); } }
@keyframes rg-a-jaw { 28% { transform: rotate(calc(var(--f) * -2deg)); } 48% { transform: rotate(calc(var(--f) * -24deg)); } 62% { transform: rotate(calc(var(--f) * 4deg)); } }
@keyframes rg-a-tail { 28% { transform: rotate(calc(var(--f) * 24deg)); } 48% { transform: rotate(calc(var(--f) * -36deg)); } }
@keyframes rg-a-wing { 28% { transform: rotate(calc(var(--f) * var(--w, 1) * -34deg)) scaleY(.7); } 48% { transform: rotate(calc(var(--f) * var(--w, 1) * 24deg)) scaleY(1.1); } }
@keyframes rg-a-body { 28% { transform: scale(.97, 1.03); } 48% { transform: scale(1.05, .96); } }

/* ----- hit and hurt ----- */
.rg.s-hit .rgw, .rg.s-hurt .rgw { animation: rg-hit .45s ease var(--as, 0s) both; }
.rg.s-hit .pt-head, .rg.s-hurt .pt-head { animation: var(--i), rg-h-head .45s ease var(--as, 0s) both; }
.rg.s-hit .pt-armF, .rg.s-hurt .pt-armF, .rg.s-hit .pt-armB, .rg.s-hurt .pt-armB, .rg.s-hit .pt-wing, .rg.s-hurt .pt-wing { animation: var(--i), rg-h-arm .45s ease var(--as, 0s) both; }
.rg.s-hit .pt-body, .rg.s-hurt .pt-body { animation: var(--i), rg-h-body .45s ease var(--as, 0s) both; }
@keyframes rg-hit { 0% { transform: none; filter: none; } 18% { transform: translate(calc(var(--dir) * -9px), 0) rotate(calc(var(--f) * -2deg)); filter: brightness(2.1) saturate(.4); } 55% { transform: translate(calc(var(--dir) * 3px), 0); filter: none; } 100% { transform: none; } }
@keyframes rg-h-head { 18% { transform: translateY(1px) rotate(calc(var(--f) * -16deg)); } 60% { transform: rotate(calc(var(--f) * 5deg)); } }
@keyframes rg-h-arm { 18% { transform: rotate(calc(var(--f) * var(--w, 1) * 26deg)); } 60% { transform: rotate(calc(var(--f) * var(--w, 1) * -8deg)); } }
@keyframes rg-h-body { 18% { transform: scale(.95, 1.04); } 60% { transform: scale(1.02, .98); } }

/* ----- defend / buff / debuff casts ----- */
.rg.s-def .rgw, .rg.s-guard .rgw { animation: rg-brace .8s var(--e) var(--as, 0s) both; }
.rg.s-def .pt-armF, .rg.s-guard .pt-armF, .rg.s-def .pt-armB, .rg.s-guard .pt-armB, .rg.s-def .pt-wep, .rg.s-guard .pt-wep { animation: var(--i), rg-c-guard .8s var(--e) var(--as, 0s) both; }
.rg.s-def .pt-head, .rg.s-guard .pt-head { animation: var(--i), rg-c-tuck .8s var(--e) var(--as, 0s) both; }
.rg.s-def .fx-def, .rg.s-guard .fx-def { animation: rg-ring .8s ease-out var(--as, 0s) both; }
.rg.s-buf .rgw, .rg.s-buff .rgw { animation: rg-rise .9s var(--e) var(--as, 0s) both; }
.rg.s-buf .pt-armF, .rg.s-buff .pt-armF, .rg.s-buf .pt-armB, .rg.s-buff .pt-armB, .rg.s-buf .pt-wep, .rg.s-buff .pt-wep, .rg.s-buf .pt-wing, .rg.s-buff .pt-wing { animation: var(--i), rg-c-raise .9s var(--e) var(--as, 0s) both; }
.rg.s-buf .pt-head, .rg.s-buff .pt-head { animation: var(--i), rg-c-look .9s var(--e) var(--as, 0s) both; }
.rg.s-buf .fx-buf, .rg.s-buff .fx-buf { animation: rg-motes .9s ease-out var(--as, 0s) both; }
.rg.s-buf .fx-buf circle, .rg.s-buff .fx-buf circle { animation: rg-mote .9s ease-out var(--as, 0s) both; }
.rg.s-deb .rgw { animation: rg-hex .9s var(--e) var(--as, 0s) both; }
.rg.s-deb .pt-armF, .rg.s-deb .pt-armB, .rg.s-deb .pt-wep, .rg.s-deb .pt-wing { animation: var(--i), rg-c-point .9s var(--e) var(--as, 0s) both; }
.rg.s-deb .pt-head { animation: var(--i), rg-c-look .9s var(--e) var(--as, 0s) both; }
.rg.s-deb .fx-deb { animation: rg-spin .9s ease-out var(--as, 0s) both; }
@keyframes rg-brace { 0% { transform: none; } 30% { transform: scale(1.06, .93); } 60% { transform: scale(1.03, .98); } 100% { transform: none; } }
@keyframes rg-c-guard { 25%, 70% { transform: rotate(calc(var(--f) * -34deg)); } }
@keyframes rg-c-tuck { 25%, 70% { transform: translateY(3px) rotate(calc(var(--f) * 4deg)); } }
@keyframes rg-ring { 0% { opacity: .95; transform: scale(.55); } 100% { opacity: 0; transform: scale(1.35); } }
@keyframes rg-rise { 0% { transform: none; } 35% { transform: translateY(-9px) scale(.98, 1.05); } 70% { transform: translateY(-2px); } 100% { transform: none; } }
@keyframes rg-c-raise { 30%, 65% { transform: rotate(calc(var(--f) * var(--w, 1) * -58deg)); } }
@keyframes rg-c-look { 30%, 65% { transform: translateY(-2px) rotate(calc(var(--f) * 7deg)); } }
@keyframes rg-motes { 0%, 100% { opacity: 1; } }
@keyframes rg-mote { 0% { opacity: 0; transform: translateY(8px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-34px) translateX(calc(var(--k) * 3px - 6px)); } }
@keyframes rg-hex { 0% { transform: none; } 30% { transform: scale(.97, 1.04) translateX(calc(var(--dir) * 5px)); } 70% { transform: translateX(calc(var(--dir) * 2px)); } 100% { transform: none; } }
@keyframes rg-c-point { 25%, 65% { transform: rotate(calc(var(--f) * var(--w, 1) * 56deg)); } }
@keyframes rg-spin { 0% { opacity: 0; transform: scale(.4) rotate(0); } 30% { opacity: .95; } 100% { opacity: 0; transform: scale(1.3) rotate(140deg); } }

/* ----- death: parts fall away from each other ----- */
.rg.s-die .rgw { animation: rg-die 1s ease-in var(--as, 0s) both; }
.rg.s-die .pt-head { animation: rg-d-head 1s ease-in var(--as, 0s) both; }
.rg.s-die .pt-armF, .rg.s-die .pt-armB, .rg.s-die .pt-wep, .rg.s-die .pt-wing { animation: rg-d-arm 1s ease-in var(--as, 0s) both; }
.rg.s-die .pt-body { animation: rg-d-body 1s ease-in var(--as, 0s) both; }
.rg.s-die .pt-aura, .rg.s-die .pt-tail, .rg.s-die .pt-jaw { animation: rg-d-arm 1s ease-in var(--as, 0s) both; }
@keyframes rg-die { 0% { transform: none; filter: brightness(2); opacity: 1; } 20% { filter: none; } 60% { opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }
@keyframes rg-d-head { 40% { transform: translate(calc(var(--dir) * -4px), 5px) rotate(calc(var(--f) * -30deg)); } 100% { transform: translate(calc(var(--dir) * -8px), 26px) rotate(calc(var(--f) * -62deg)); } }
@keyframes rg-d-arm { 40% { transform: rotate(calc(var(--f) * var(--w, 1) * 38deg)); } 100% { transform: translateY(12px) rotate(calc(var(--f) * var(--w, 1) * 70deg)); } }
@keyframes rg-d-body { 40% { transform: scale(1.04, .86); } 100% { transform: scale(1.12, .46); } }

/* ----- phase change (boss) ----- */
.rg.s-phase .rgw { animation: rg-phase 1.5s ease var(--as, 0s) both; }
.rg.s-phase .pt-head { animation: var(--i), rg-p-head 1.5s ease var(--as, 0s) both; }
.rg.s-phase .pt-armF, .rg.s-phase .pt-armB, .rg.s-phase .pt-wep, .rg.s-phase .pt-wing { animation: var(--i), rg-p-arm 1.5s ease var(--as, 0s) both; }
.rg.s-phase .fx-flash { animation: rg-flash 1.5s ease-out var(--as, 0s) both; }
.rg.s-phase .fx-burst path { animation: rg-shard 1.3s ease-out var(--as, 0s) both; }
@keyframes rg-phase { 0% { transform: none; } 10%, 30%, 50% { transform: translateX(-4px) scale(1.04); } 20%, 40%, 60% { transform: translateX(4px) scale(1.04); } 75% { transform: scale(1.1); filter: brightness(1.8); } 100% { transform: none; filter: none; } }
@keyframes rg-p-head { 30% { transform: translateY(-4px) rotate(calc(var(--f) * 10deg)); } 70% { transform: translateY(-3px) rotate(calc(var(--f) * -12deg)); } }
@keyframes rg-p-arm { 30% { transform: rotate(calc(var(--f) * var(--w, 1) * -50deg)); } 70% { transform: rotate(calc(var(--f) * var(--w, 1) * 40deg)); } }
@keyframes rg-flash { 0% { opacity: 0; transform: scale(.4); } 45% { opacity: .55; } 100% { opacity: 0; transform: scale(1.1); } }
@keyframes rg-shard { 0% { opacity: 0; transform: rotate(var(--a)) translateX(4px); } 20% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateX(54px); } }

/* ----- boss: The Weeping Bellwarden tolls ----- */
.rg.toll .rgw { animation: rg-toll 2.4s ease-in-out var(--id, 0s) infinite; transform-origin: 60px 10px; }
@keyframes rg-toll { 25% { transform: rotate(5deg); } 75% { transform: rotate(-5deg); } }
.rg.toll .fx-def { stroke: #6FD0FF; animation: rg-ring 2.4s ease-out var(--id, 0s) infinite; }

/* ----- hero attacks ----- */
.rg.s-lunge .rgw { animation: rg-dash .7s var(--e) var(--as, 0s) both; }
.rg.s-lunge .pt-wep, .rg.s-lunge .pt-armF { animation: var(--i), rg-a-wep .7s var(--e) var(--as, 0s) both; }
.rg.s-lunge .pt-head { animation: var(--i), rg-a-head .7s var(--e) var(--as, 0s) both; }
.rg.s-lunge .pt-body { animation: var(--i), rg-a-body .7s var(--e) var(--as, 0s) both; }
@keyframes rg-dash { 0% { transform: none; } 22% { transform: translate(calc(var(--dir) * -6px), 0) skewX(calc(var(--f) * 4deg)); } 40% { transform: translate(calc(var(--dir) * 26px), 0) skewX(calc(var(--f) * -9deg)); } 100% { transform: none; } }
.rg.s-slam .rgw { animation: rg-slam .9s var(--e) var(--as, 0s) both; }
.rg.s-slam .pt-armF, .rg.s-slam .pt-wep { animation: var(--i), rg-s-arm .9s var(--e) var(--as, 0s) both; }
.rg.s-slam .pt-head { animation: var(--i), rg-a-head .9s var(--e) var(--as, 0s) both; }
.rg.s-slam .sfx-slam, .rg.s-smash .sfx-slam { animation: rg-shock .9s ease-out var(--as, 0s) both; }
@keyframes rg-slam { 0% { transform: none; } 30% { transform: translate(calc(var(--dir) * -6px), -12px) scale(.98, 1.05); } 48% { transform: translate(calc(var(--dir) * 22px), 4px) scale(1.06, .94); } 100% { transform: none; } }
@keyframes rg-s-arm { 30% { transform: rotate(calc(var(--f) * -50deg)); } 48% { transform: rotate(calc(var(--f) * 42deg)); } 75% { transform: rotate(calc(var(--f) * 10deg)); } }
.rg.s-smash .rgw { animation: rg-smash .95s var(--e) var(--as, 0s) both; }
.rg.s-smash .pt-armF, .rg.s-smash .pt-armB, .rg.s-smash .pt-wep { animation: var(--i), rg-m-arm .95s var(--e) var(--as, 0s) both; }
.rg.s-smash .pt-head { animation: var(--i), rg-a-head .95s var(--e) var(--as, 0s) both; }
@keyframes rg-smash { 0% { transform: none; } 35% { transform: translate(calc(var(--dir) * -4px), -14px) scale(.97, 1.07); } 52% { transform: translate(calc(var(--dir) * 14px), 6px) scale(1.08, .92); } 100% { transform: none; } }
@keyframes rg-m-arm { 35% { transform: rotate(calc(var(--f) * -110deg)); } 52% { transform: rotate(calc(var(--f) * 45deg)); } 80% { transform: rotate(calc(var(--f) * 12deg)); } }
.rg .sfx { display: none; opacity: 0; transform-box: fill-box; transform-origin: center; }
@keyframes rg-shock { 0% { opacity: 0; transform: scale(.3); } 45% { opacity: .9; } 100% { opacity: 0; transform: scale(1.6); } }
/* Duelist Footwork: a dash with speed lines */
.rg.s-foot .rgw { animation: rg-foot .9s var(--e) var(--as, 0s) both; }
.rg.s-foot .pt-wep, .rg.s-foot .pt-armF { animation: var(--i), rg-a-wep .9s var(--e) var(--as, 0s) both; }
.rg.s-foot .sfx-foot { animation: rg-streak .9s ease-out var(--as, 0s) both; }
@keyframes rg-foot { 0% { transform: none; } 18% { transform: translate(calc(var(--dir) * -10px), 0) skewX(calc(var(--f) * 5deg)); } 36% { transform: translate(calc(var(--dir) * 28px), -2px) skewX(calc(var(--f) * -10deg)); } 60% { transform: translate(calc(var(--dir) * -4px), 0) skewX(calc(var(--f) * 3deg)); } 80% { transform: translate(calc(var(--dir) * 10px), 0); } 100% { transform: none; } }
@keyframes rg-streak { 0% { opacity: 0; transform: translateX(calc(var(--dir) * -20px)); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateX(calc(var(--dir) * 30px)); } }

/* ----- Brute stances ----- */
.rg.sn-fury .rgw { filter: drop-shadow(0 0 3px #FF5A1F) saturate(1.25) brightness(1.06); }
.rg.sn-fury .pt-body { animation: ri-furyb 1.6s ease-in-out var(--id, 0s) infinite; }
.rg.sn-fury .sfx-fury, .rg.sn-iron .sfx-iron, .rg.sn-calm .sfx-calm { opacity: 1; }
.rg .sfx-fury path { animation: rg-flame .8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
.rg .sfx-fury path:nth-child(2n) { animation-delay: -.3s; animation-duration: .65s; }
.rg .sfx-fury path:nth-child(3n) { animation-delay: -.55s; }
.rg.sn-iron .rgw { filter: drop-shadow(0 0 2px #C4CAD2) grayscale(.35) contrast(1.1); }
.rg.sn-iron .pt-body { animation: none; }
.rg .sfx-iron .shine { animation: rg-shine 2.4s ease-in-out infinite; }
.rg.sn-calm .rgw { filter: drop-shadow(0 0 5px #9CF4FF) brightness(1.08); }
.rg .sfx-calm .halo { animation: ri-aura 3.2s ease-in-out infinite; }
.rg .sfx-calm .orb2 { animation: rg-orb 3.2s ease-in-out infinite; }
.rg.s-stance .sfx-ring { animation: rg-ring .9s ease-out var(--as, 0s) both; }
.rg .sfx-ring { opacity: 0; transform-box: fill-box; transform-origin: center; }
@keyframes ri-furyb { 50% { transform: scale(1.03, 1.05); } }
@keyframes rg-flame { 0% { transform: scale(.85, .8) skewX(-4deg); opacity: .75; } 100% { transform: scale(1.1, 1.25) skewX(5deg); opacity: 1; } }
@keyframes rg-shine { 0% { transform: translateX(-30px); opacity: 0; } 30% { opacity: .9; } 70% { opacity: .9; } 100% { transform: translateX(70px); opacity: 0; } }
@keyframes rg-orb { 0% { transform: translateY(6px); opacity: 0; } 40% { opacity: .9; } 100% { transform: translateY(-26px); opacity: 0; } }
/* heroes down in a duel / co-op */
.rg.dn .rgw { animation: rg-down .8s ease-out both; }
@keyframes rg-down { to { transform: translateY(14px) scale(1.02, .9); opacity: .4; filter: grayscale(1) brightness(.8); } }
.duelfoe .rg { transform: scaleX(-1); }
html.rm .rg *, html.rm .rg { animation: none !important; }

.rg .crack { opacity: 0; }
.rg.p2 .crack { opacity: 1; }
.rg.p2-cog .rgw { filter: drop-shadow(0 0 4px #FF7A1F) saturate(1.2); }
.rg.p2-spire .rgw { filter: drop-shadow(0 0 5px #B46AFF); }

/* filters are costly: only draw effects while they are active; keep blurred auras still */
.rg.s-def .fx-def, .rg.s-guard .fx-def, .rg.s-buf .fx-buf, .rg.s-buff .fx-buf, .rg.s-deb .fx-deb, .rg.s-phase .fx-flash, .rg.s-phase .fx-burst, .rg.toll .fx-def { display: inline; }
.rg.s-slam .sfx-slam, .rg.s-smash .sfx-slam, .rg.s-foot .sfx-foot, .rg.sn-fury .sfx-fury, .rg.sn-iron .sfx-iron, .rg.sn-calm .sfx-calm, .rg.s-stance .sfx-ring { display: inline; }
.rg .pt-aura, .rg .sfx-calm .halo { animation: none !important; }
.rg.lite .pt-armF, .rg.lite .pt-armB, .rg.lite .pt-wep, .rg.lite .pt-tail, .rg.lite .pt-jaw { animation: none; }
/* Rotated tablets and short panes: never pin the control dock over the battlefield, and let the stage use the width */
@media (max-height: 720px) and (orientation: landscape) { .dock { position: static; margin: 0; padding: 0; background: none; box-shadow: none; } }
@media (orientation: landscape) and (min-width: 641px) and (max-width: 1100px) {
  .stage { grid-template-columns: minmax(150px, 210px) minmax(0, 1fr); gap: 12px; padding: 12px; }
  .stage.duel { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .herobox { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
  .herobox .portrait { width: 100%; }
  .enemy, .enemy.boss { width: min(236px, 30vw); min-width: 160px; }
  .enemy.boss { width: min(300px, 38vw); }
  .enemies { gap: 10px; }
  .controls { grid-template-columns: auto minmax(0, 1fr) auto; }
  .controls .endwrap { grid-column: auto; display: block; }
}
@media (max-width: 860px) and (orientation: portrait) { .enemies { gap: 12px; } .hand { justify-content: flex-start; } }
/* Portrait tablets: keep energy / End Turn pinned like on phones */
@media (min-width: 641px) and (max-width: 860px) and (orientation: portrait) {
  .dock { position: sticky; bottom: 0; z-index: 30; padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, #121016E6, #121016 30%); box-shadow: 0 -10px 24px #000A; display: flex; flex-direction: column; gap: 6px; }
}
/* Very narrow phones */
@media (max-width: 360px) {
  body { padding-left: 6px; padding-right: 6px; }
  .topbar { gap: 4px 8px; font-size: 14px; }
  .topbar .btn { padding: 6px 8px; font-size: 14px; }
  .controls { gap: 6px; padding: 6px; }
  .energy { width: 42px; height: 42px; font-size: 17px; }
  .controls .endwrap .btn { padding: 8px 10px; font-size: 15px; }
  .incoming .big { font-size: 14px; }
  .hand .card { width: 96px; }
  .panel { padding: 14px; }
  .title h1 { font-size: 38px; }
}
/* Touch polish: no double-tap zoom (pinch-zoom stays available), no sticky hover, 44px targets, snap-scrolling hand */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body, button, .btn, .card, .node, .hand { touch-action: manipulation; }
.hand { overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; scroll-padding-inline: 16px; }
.hand .card { scroll-snap-align: center; }
@media (hover: none) { .card:hover, .hand .card:hover { transform: none; } .card.sel, .hand .card.sel { transform: translateY(-12px); } }
@media (pointer: coarse) { .btn, .topbar .btn, .controls .endwrap .btn { min-height: 44px; } .hand { padding-top: 24px; padding-bottom: 14px; } }
/* ---------- Sound panel ---------- */
.sndfloat { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); z-index: 40; min-height: 40px; padding: 6px 12px; display: flex; gap: 6px; align-items: center; font-size: 16px; }
.btn.snd { display: inline-flex; gap: 6px; align-items: center; }
.sndpanel { position: fixed; top: calc(64px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); z-index: 41; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px #000A; font-size: 17px; }
.sndpanel[hidden] { display: none; }
.sndpanel label { display: flex; align-items: center; gap: 10px; }
.sndpanel input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--gold); }
.sndpanel input[type=range] { width: 130px; accent-color: var(--gold); }
.sndpanel .sechead { font-family: var(--display); font-weight: 700; color: var(--gold); margin-top: 2px; }
/* ---------- Display settings: larger text, high contrast / colorblind-safe ---------- */
html.bigtext #app { zoom: 1.25; }
html.hc {
  --bg: #000; --panel: #0C0C10; --panel2: #1A1A22; --line: #9A9AA8;
  --ink: #FFFFFF; --muted: #F0F0F0; --faint: #D8D8D8;
  --teal: #56E0FF; --gold: #F0E442; --blood: #E8743B; --skill: #56B4E9; --power: #F0E442; --status: #BBBBBB;
  --atk-bg: #3B1200; --atk-fg: #FFC49B;
  --def-bg: #00263F; --def-fg: #BFE6FF;
  --buf-bg: #2E2A00; --buf-fg: #FFF08A;
  --deb-bg: #2A0A22; --deb-fg: #FFC6EC;
}
html.hc :focus-visible { outline: 4px solid #FFFFFF; outline-offset: 3px; box-shadow: 0 0 0 7px #000; }

html.hc .float { text-shadow: 0 0 3px #000, 0 2px 0 #000, 0 0 10px #000; }
html.hc .float.block { color: #BFE6FF; }

/* Colorblind mode: shapes + patterns in addition to color */
html.cb .badge[data-ic]::before { content: attr(data-ic) ' '; }
html.cb .badge.bad { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 4px, transparent 4px 8px); border-style: double; border-width: 3px; }

html.cb .intentbar.k-atk { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 5px, transparent 5px 10px); }
html.cb .intentbar.k-def { background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.16) 0 3px, transparent 3px 8px); }

html.cb .intentbar.k-deb { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 3px, transparent 3px 7px), repeating-linear-gradient(-45deg, rgba(255,255,255,.14) 0 3px, transparent 3px 7px); }

/* ---------- Map art ---------- */
.mapcard .mapwrap { max-width: 540px; height: auto; border-radius: 14px; overflow: hidden; border: 1px solid #000A; box-shadow: inset 0 0 40px #000B, 0 6px 22px #0008; background: #0C0A12; }
.mapart, .mapfx, .mapfog { position: absolute; left: 0; width: 100%; pointer-events: none; }
.mapart { top: 0; height: 100%; }
.mapfx { top: 0; height: 100%; overflow: hidden; z-index: 1; }
.mapfog { top: 0; z-index: 2; }
.act1 .mapfog { background: linear-gradient(to bottom, rgba(8, 23, 27, .8), rgba(8, 23, 27, .62) 75%, rgba(8, 23, 27, 0)); }
.act2 .mapfog { background: linear-gradient(to bottom, rgba(23, 11, 8, .8), rgba(23, 11, 8, .62) 75%, rgba(23, 11, 8, 0)); }
.act3 .mapfog { background: linear-gradient(to bottom, rgba(10, 6, 20, .8), rgba(10, 6, 20, .62) 75%, rgba(10, 6, 20, 0)); }

.me-shadow { fill: none; stroke: #000; stroke-opacity: .45; stroke-width: 7; stroke-linecap: round; }

@keyframes me-flow { to { stroke-dashoffset: -28; } }
.mapcard .node { z-index: 3; width: 54px; height: 54px; border-width: 3px; background: radial-gradient(circle at 35% 30%, #4A3E5E, #1F1830 75%); box-shadow: 0 3px 8px #000A, inset 0 0 0 2px #0006; color: var(--ink); }
.mapcard .node svg { width: 33px; height: 33px; }
.node.t-fight { background: radial-gradient(circle at 35% 30%, #8A3440, #3A141C 78%); border-color: #C4646E; }
.node.t-elite { background: radial-gradient(circle at 35% 30%, #6A3AA8, #26123F 78%); border-color: #B58AF0; box-shadow: 0 0 12px #8A5AD066, 0 3px 8px #000A, inset 0 0 0 2px #0006; }
.node.t-rest { background: radial-gradient(circle at 35% 30%, #8A5A2A, #3A2210 78%); border-color: #E89A3A; }
.node.t-shop { background: radial-gradient(circle at 35% 30%, #7A6A2A, #342A10 78%); border-color: #E8BE52; }
.node.t-treasure { background: radial-gradient(circle at 35% 30%, #8A6A2A, #3A2A10 78%); border-color: #F0CE6A; }
.mapcard .node.bossnode { width: 80px; height: 80px; border-width: 4px; background: radial-gradient(circle at 35% 30%, #2A4A6A, #0E1A2E 78%); border-color: #6FD0FF; box-shadow: 0 0 18px #6FD0FF66, 0 4px 10px #000A; }
.act2 .node.bossnode { background: radial-gradient(circle at 35% 30%, #6A4A22, #2A1608 78%); border-color: #F0CE6A; box-shadow: 0 0 18px #E8BE5266, 0 4px 10px #000A; }
.act3 .node.bossnode { background: radial-gradient(circle at 35% 30%, #4A2A8A, #150A2E 78%); border-color: #B49AFF; box-shadow: 0 0 20px #8A6AFF88, 0 4px 10px #000A; }

/* ----- audio: map game state onto music scenes and event sounds ----- */
function sndSync(V, prev) {
  const scr = V ? V.scr : 'title';
  const was = CL.sndScr; CL.sndScr = scr;
  if (!V || scr === 'lobby') { SND.scene('menu'); return; }
  const ak = 'a' + Math.min(3, Math.max(1, V.act || 1));
  let key = ak, mode = 'calm';
  if (scr === 'combat' && V.cb) { mode = V.cb.duel || V.cb.k === 'boss' ? 'boss' : 'fight'; if (V.cb.duel) key = 'duel'; }
  else if (scr === 'duelintro' || scr === 'duelend') key = 'duel';
  else if (scr === 'victory') key = 'menu';
  else if (scr === 'defeat') key = 'none';
  SND.scene(key, mode);
  if (was && was !== scr) {
    if (scr === 'reward') SND.stinger('win');
    else if (scr === 'actclear' || scr === 'duelend') SND.stinger('clear');
    else if (scr === 'victory') SND.stinger('final');
    else if (scr === 'defeat') SND.stinger('defeat');
    else if (scr === 'treasure') SND.ui('thud');
  }
  if (!V.cb || scr !== 'combat') { CL.sndHand = null; return; }
  const c = V.cb, me = V.P[V.me].h;
  const hu = c.hand.map(x => x[0]);
  const fresh = CL.sndHand ? hu.filter(u => CL.sndHand.indexOf(u) < 0) : (was && was !== 'combat' ? hu : []);
  fresh.slice(0, 6).forEach((u, i) => SND.fire('draw', 0.05 * i));
  CL.sndHand = hu;
  if (CL.sndT !== undefined && c.t !== CL.sndT && !c.duel) SND.ui('turn');
  CL.sndT = c.t;
  c.en.forEach(e => {
    if (e.ac > prev) SND.enemy(e.key, 'atk');
    if (e.ds > prev) SND.enemy(e.key, 'die', 0.12);
    const pk = V.act + ':' + V.floor + ':' + e.idx;
    CL.sndP2 = CL.sndP2 || {};
    if (e.p2 && !CL.sndP2[pk]) { CL.sndP2[pk] = 1; if (CL.seen && prev > 0) SND.ui('phase'); }
  });
  if (c.toll && !CL.sndToll) SND.ui('toll');
  CL.sndToll = c.toll;
  CL.sndSn = CL.sndSn || {};
  c.S.forEach(s => {
    const h = V.P[s.pi].h;
    if (s.an && s.an[0] > prev) {
      const k = s.an[1];
      if (k === 'lunge' || k === 'slam' || k === 'smash') { SND.hero(h, 'swing'); CL.sndHero = h; }
      else if (k === 'guard') SND.hero(h, 'guard'); else if (k === 'buff') SND.hero(h, 'buff'); else if (k === 'hurt') SND.hero(h, 'hurt', 0.12);
    }
    if (s.fw && s.fw[0] > prev && s.fw[1] > 0) SND.hero(h, 'foot');
    const was2 = CL.sndSn[s.pi]; CL.sndSn[s.pi] = s.sn || '';
    if (s.sn && was2 !== undefined && s.sn !== was2 && h === 'brute') SND.hero(h, 'stance:' + s.sn);
  });
  let n = 0;
  (V.fx || []).forEach(f => {
    if (f.s <= prev || !f.x || f.t[0] !== 'e') return;
    if (f.x[0] === '−') { SND.hit(CL.sndHero || me, 0.08 + 0.09 * n); SND.enemy(((c.en.find(e => 'e' + e.idx === f.t) || {}).key) || 'moth', 'hit', 0.1 + 0.09 * n); n++; }
    else if (f.x === 'Blocked') { SND.block(CL.sndHero || me, 0.06 + 0.09 * n); n++; }
  });
}

    tog.addEventListener('click', () => { const o = panel.classList.toggle('open'); tog.setAttribute('aria-expanded', o ? 'true' : 'false'); });
    root.addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('open')) { panel.classList.remove('open'); tog.setAttribute('aria-expanded', 'false'); tog.focus(); } });
    root.appendChild(panel); root.appendChild(tog); document.body.appendChild(root);
    const bub = document.createElement('div'); bub.id = 'emotebubble'; bub.setAttribute('role', 'status'); bub.setAttribute('aria-live', 'polite'); document.body.appendChild(bub);
  }
  const V = CL.V;
  const show = CL.role === 'online' && wsConnected() && !!V && V.n > 1;
  root.style.display = show ? 'flex' : 'none';
  if (!show) document.getElementById('emotepanel').classList.remove('open');
  const cool = Date.now() < emoteCool;
  document.querySelectorAll('#emotepanel button').forEach(b => { b.disabled = cool; });
  const bub = document.getElementById('emotebubble');
  if (bub.style.display !== 'none' && Date.now() > emoteHide) bub.style.display = 'none';
}
function showEmote(m) {
  const label = EMOTES[m.id];
  if (!label || !CL.V) return;
  emoteUI();
  const mine = m.from === CL.V.me;
  let who = 'Partner';
  try { if (!mine && CL.V.P[m.from]) who = vName(CL.V, m.from); else if (mine) who = 'You'; } catch (e) {}
  const bub = document.getElementById('emotebubble');
  bub.textContent = who + ': ' + label;
  bub.style.display = 'block';
  emoteHide = Date.now() + 3000;
}
setInterval(emoteUI, 500);
window.addEventListener('online', () => { if (CL.role === 'online' && !wsConnected() && !(ws && ws.readyState === 0)) { wsTries = 0; connect(); } else requestSync(); });
function connect() {
  clearTimeout(wsTimer);
  if (!coldSince) coldSince = Date.now();
  CL.net.state = wsTries ? 'Reconnecting to the game server…' : 'Connecting to the game server…';
  render();
  let sock;
  try { sock = new WebSocket(wsURL()); } catch (e) { scheduleReconnect(); return; }
  ws = sock;
  sock.onopen = () => {
    const wasRetrying = wsTries > 0;
    wsTries = 0; actLock = 0; srvRestart = 0; coldSince = 0; CL.net.state = 'Connected'; CL.err = '';
    if (wasRetrying) netFlash('Reconnected.');
    updateColdScreen();
    hbStart(sock);
    if (CL.pending) wsSend(CL.pending); else if (CL.code) wsSend({ t: 'join', code: CL.code, tok: CL.tok, build: BUILD_ID });
    if (document.hidden) wsSend({ t: 'away', v: true });
    render();
  };
  sock.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    hbPongBy = 0;
    if (m.t === 'pong') return;
    if (m.t === 'presence') { if (PRES_LABEL[m.st]) { CL.pres = m.st; render(); } }
    else if (m.t === 'emote') showEmote(m);
    else if (m.t === 'nosession') {
      if (CL.code && !rejoinTried) { rejoinTried = true; wsSend({ t: 'join', code: CL.code, tok: CL.tok, build: BUILD_ID }); }
    }
    else if (m.t === 'restart') { srvRestart = Date.now(); updateNetBar(); }
    else if (m.t === 'joined') { CL.pres = ''; CL.code = m.code; CL.pending = null; try { sessionStorage.setItem(CODEKEY, m.code); } catch (e) {} render(); }
    else if (m.t === 'view') {
      actLock = 0; lastViewAt = Date.now(); rejoinTried = false;
      CL.V = m.v;
      if (CL.sel != null && (!m.v.cb || !m.v.cb.hand.some(h => h[0] === CL.sel))) CL.sel = null;
      render();
    } else if (m.t === 'err') {
      actLock = 0;
      const slow = !m.fatal && /slow down/i.test(m.msg || '');
      if (slow) { netFlash('Slow down: too many actions too quickly. Wait a moment.'); return; }
      CL.err = m.msg || 'Server error';
      if (m.fatal) { const msg = CL.err; leaveAll(); CL.err = msg; render(); } else render();
    }
  };
  sock.onclose = ev => {
    if (ev && ev.code === 1013 && ws === sock && CL.role === 'online') {
      const msg = 'Too many connections. Close other tabs and try again.';
      leaveAll(); CL.err = msg; render();
      return;
    }
    dropSock(sock, ev && ev.code);
  };
  sock.onerror = () => {};
}
function scheduleReconnect() {
  clearTimeout(wsTimer); wsTries++;
  const delay = Math.round(Math.min(15000, 500 * Math.pow(2, wsTries - 1)) * (0.8 + Math.random() * 0.4));
  nextRetryAt = Date.now() + delay;
  wsTimer = setTimeout(connect, delay);
  updateNetBar();
}
function goOnline(first) {
  if (first && (first.t === 'create' || first.t === 'join')) first.build = BUILD_ID;
  CL.role = 'online'; CL.V = null; CL.seen = false; CL.sel = null; CL.overlay = null; CL.err = ''; CL.pending = first;
  if (first && first.code) CL.code = first.code;
  if (!wsSend(first)) { if (!ws) connect(); }
  render();
}
function flyCard(el, targetKey) {
  if (REDUCE || !el || !el.animate) return null;
  const t = document.querySelector('[data-float="' + targetKey + '"]');
  if (!t) return null;
  const r = el.getBoundingClientRect(), tr = t.getBoundingClientRect();
  if (!r.width) return null;
  const g = el.cloneNode(true);
  g.removeAttribute('data-act'); g.removeAttribute('data-arg'); g.removeAttribute('id');
  g.setAttribute('aria-hidden', 'true'); g.tabIndex = -1; g.classList.remove('sel');
  g.classList.add('flyghost');
  g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
  document.body.appendChild(g);
  const dx = tr.left + tr.width / 2 - (r.left + r.width / 2), dy = tr.top + tr.height / 2 - (r.top + r.height / 2);
  const an = g.animate([
    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
    { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(.35)', opacity: 0.2 }
  ], { duration: 380, easing: 'ease-in', fill: 'forwards' });
  an.onfinish = () => g.remove();
  setTimeout(() => g.remove(), 700);
  return g;
}
function sendCard(V, u, tgtIdx) {
  const h = V && V.cb && V.cb.hand.find(x => x[0] === u);
  const el = document.querySelector('.hand [data-act="card"][data-arg="' + u + '"]');
  let g = null;
  if (h && el) {
    const d = CARDS[h[1]];
    let key;
    if (tgtIdx != null) key = 'e' + tgtIdx;
    else if (d.t === 'attack' && V.cb.duel && V.n > 1) key = 'p' + (1 - V.me);
    else if (d.t === 'attack') { const live = V.cb.en.filter(e => !e.dead); key = live.length ? 'e' + live[0].idx : 'p' + V.me; }
    else key = 'p' + V.me;
    g = flyCard(el, key);
  }
  if (!send('card', u, tgtIdx) && g) g.remove();
}
function send(a, x, y) {
  if (CL.role === 'online') {
    if (!wsConnected()) { netFlash('Offline: action not sent.'); return false; }
    if (Date.now() < actLock) return false;
    if (wsSend({ t: 'act', a, x: x == null ? null : x, y: y == null ? null : y })) {
      actLock = Date.now() + 1200;
      const sentAt = Date.now();
      setTimeout(() => { if (lastViewAt < sentAt) { lastSyncAt = 0; requestSync(); } }, 4000);
      return true;
    }
    return false;
  }
  E.doAction(0, a, x, y);
  return true;
}
function inviteURL() { return location.origin + location.pathname + '?room=' + encodeURIComponent((CL.code || '').toUpperCase()); }
let copiedTimer = 0;
function lobbyNote(msg) {
  CL.copied = msg; render();
  clearTimeout(copiedTimer);
  copiedTimer = setTimeout(() => { CL.copied = ''; render(); }, 2500);
}
function lobbyCopy(text, okMsg) {
  const done = lobbyNote;
  const fallback = () => {
    let ok = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) {}
    done(ok ? okMsg : 'Copy failed. Select and copy manually: ' + text);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(okMsg), fallback);
  else fallback();
}
function leaveAll() {
  if (CL.role === 'online') { wsSend({ t: 'leave' }); }
  clearTimeout(copiedTimer); CL.copied = '';
  clearTimeout(wsTimer);
  if (ws) { const s = ws; ws = null; try { s.close(); } catch (e) {} }
  try { sessionStorage.removeItem(CODEKEY); } catch (e) {}
  E.G = null; CL.role = 'none'; CL.V = null; CL.sel = null; CL.overlay = null; CL.seen = false; CL.code = ''; CL.pending = null; CL.pres = ''; wsTries = 0;
  CL.net = { state: '', peers: 0, err: '' };
  render();
}
function loadSave() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { return null; }
  if (!raw) return null;
  try {
    const s = JSON.parse(raw), G = s && s.G;
    const ok = s && typeof s === 'object' && s.sv === SAVE_VERSION && s.gv === engineGV() &&
      G && typeof G === 'object' && G.mode === 'solo' && G.v === s.gv &&
      G.screen !== 'defeat' && G.screen !== 'victory' &&
      Array.isArray(G.P) && G.P.length === 1 && G.P[0] && HEROES[G.P[0].hero] &&
      Array.isArray(G.P[0].deck) && Array.isArray(G.P[0].relics) && Number.isFinite(G.P[0].hp) &&
      Number.isInteger(G.act) && G.act >= 1 && G.act <= 3 && G.map && typeof G.map === 'object' &&
      typeof s.uidN === 'number' && Number.isFinite(s.uidN);
    if (ok) return s;
  } catch (e) {}
  clearSave();
  return null;
}

/* ---------- Input ---------- */
function curView() { return CL.role === 'online' ? CL.V : soloView(); }
document.getElementById('app').addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, arg = b.dataset.arg;
  const V = curView();
  switch (act) {
    case 'solo': CL.role = 'pick'; E.G = null; render(); break;
    case 'solohero': { const G = E.baseG('solo', prefDiff()); G.P = [E.newPlayer(arg, CL.tok)]; E.G = G; CL.role = 'solo'; CL.seen = false; render(); saveSolo(); break; }
    case 'host': CL.err = ''; goOnline({ t: 'create', tok: CL.tok, diff: prefDiff() }); break;
    case 'continue': {
      const s = loadSave();
      if (!s) { render(); break; }
      E.uidN = s.uidN || 1000; CL.seen = false;
      if (s.G.combat) s.G.combat.busy = false;
      E.G = s.G; CL.role = 'solo'; render();
      break;
    }
    case 'copycode': lobbyCopy((CL.code || '').toUpperCase(), 'Room code copied.'); break;
    case 'copylink': lobbyCopy(inviteURL(), 'Invite link copied.'); break;
    case 'sharelink':
      if (navigator.share) navigator.share({ title: 'Masked Spire co-op', text: 'Join my Masked Spire co-op run! Room ' + (CL.code || '').toUpperCase(), url: inviteURL() }).then(() => lobbyNote('Invite shared.'), err => { if (!err || err.name !== 'AbortError') lobbyCopy(inviteURL(), 'Invite link copied.'); });
      else lobbyCopy(inviteURL(), 'Invite link copied.');
      break;
    case 'snd': SND.togglePanel(); break;
    case 'setdiff': setPrefDiff(Number(arg)); render(); break;
    case 'hostdiff': setPrefDiff(Number(arg)); send('diff', Number(arg)); break;
    case 'leave': leaveAll(); break;
    case 'hero': send('hero', arg); break;
    case 'start': send('start'); break;
    case 'node': if (b.getAttribute('aria-disabled') !== 'true') send('node', arg); break;
    case 'card': {
      if (!V || !V.cb) break;
      const u = Number(arg);
      const h = V.cb.hand.find(x => x[0] === u);
      if (!h) break;
      const d = CARDS[h[1]];
      if (d.tg && !V.cb.duel) {
        const live = V.cb.en.filter(e => !e.dead);
        if (live.length > 1) { CL.sel = CL.sel === u ? null : u; paint(V); break; }
        sendCard(V, u, live.length ? live[0].idx : null);
      } else sendCard(V, u, null);
      CL.sel = null;
      break;
    }
    case 'enemy': if (CL.sel != null) { const u = CL.sel; CL.sel = null; sendCard(V, u, Number(arg)); } break;
    case 'end': CL.sel = null; send('end'); break;
    case 'chest':
      if (CL.curChest && !(CL.chest && CL.chest.key === CL.curChest.key)) {
        CL.chest = { key: CL.curChest.key, t: performance.now() };
        chestSfx(CL.curChest.relic);
        render();
      }
      break;
    case 'reward': send('reward', Number(arg)); break;
    case 'bossreward': send('bossreward', Number(arg)); break;
    case 'done': send('done'); break;
    case 'restheal': send('restheal'); break;
    case 'restremove': CL.overlay = { mode: 'remove', from: 'rest' }; paint(V); break;
    case 'shopremove': CL.overlay = { mode: 'remove', from: 'shop' }; paint(V); break;
    case 'buy': send('buy', Number(arg)); break;
    case 'deck': CL.overlay = { mode: 'view' }; paint(V); break;
    case 'close': CL.overlay = null; paint(V); break;
    case 'remove': { const from = CL.overlay && CL.overlay.from; CL.overlay = null; send('remove', Number(arg), from); if (CL.role === 'online') paint(V); break; }
    default: break;
  }
});
/* Sound hook layer: delegated hover / click / end-turn sounds for any [data-act] control */
(function () {
  const root = document.getElementById('app');
  const live = t => { const b = t && t.closest ? t.closest('[data-act]') : null; return b && !b.disabled && b.getAttribute('aria-disabled') !== 'true' ? b : null; };
  let lastHover = 0;
  root.addEventListener('pointerover', ev => {
    if (ev.pointerType !== 'mouse') return;
    const b = live(ev.target);
    if (!b || b === live(ev.relatedTarget)) return;
    const now = performance.now();
    if (now - lastHover < 70) return;
    lastHover = now;
    SND.fire('hover');
  });
  root.addEventListener('click', ev => {
    const b = live(ev.target);
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'end') SND.fire('endturn');
    else if (act === 'card' && b.classList.contains('dim')) SND.ui('bad');
    else if (act === 'card' || act === 'enemy') SND.fire('card');
    else SND.fire('click');
  }, true);
})();
/* Damage preview: fills the .pv placeholders in place (no repaint, so hover can't loop). */
function showPreview(V) {
  const app = document.getElementById('app');
  app.querySelectorAll('.pv').forEach(el => { el.textContent = ''; el.className = 'pv'; });
  if (!V || !V.cb || V.cb.duel) return;
  const u = CL.sel != null ? CL.sel : CL.hov;
  if (u == null) return;
  const h = V.cb.hand.find(x => x[0] === u);
  const s = V.cb.S[V.me];
  if (!h || !s) return;
  V.cb.en.forEach(e => {
    if (e.dead) return;
    const el = app.querySelector('.pv[data-pv="' + e.idx + '"]');
    if (!el) return;
    const r = E.previewCard(h[1], s, e);
    if (!r) return;
    let t = (r.hits > 1 ? r.d + '×' + r.hits : '' + r.d) + ' dmg · ';
    t += r.lethal ? 'Lethal' : r.loss > 0 ? '−' + r.loss + ' HP → ' + r.hp : 'No HP damage';
    if (r.blocked) t += ' · ' + r.blocked + ' blocked';
    if (r.parried) t += ' · ' + r.parried + ' hit parried';
    el.textContent = t;
    el.className = 'pv' + (r.lethal ? ' lethal' : r.loss === 0 ? ' safe' : '');
  });
}
const pvHover = ev => {
  const c = ev.target.closest ? ev.target.closest('.card[data-act="card"]') : null;
  const u = c ? Number(c.dataset.arg) : null;
  if (u === (CL.hov == null ? null : CL.hov)) return;
  CL.hov = u; showPreview(CL.pvV);
};
document.getElementById('app').addEventListener('mouseover', pvHover);
document.getElementById('app').addEventListener('focusin', pvHover);
document.getElementById('app').addEventListener('mouseleave', () => { CL.hov = null; showPreview(CL.pvV); });
document.getElementById('app').addEventListener('focusout', () => { CL.hov = null; showPreview(CL.pvV); });
document.getElementById('app').addEventListener('submit', ev => {
  const f = ev.target.closest('[data-form="join"]');
  if (!f) return;
  ev.preventDefault();
  const el = document.getElementById('joincode');
  const code = String(el ? el.value : '').trim().toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5);

document.getElementById('app').addEventListener('input', ev => { if (ev.target.id === 'joincode') CL.joinCode = ev.target.value; });

/* ---------- Build badge ---------- */
(function buildBadge() {
  const st = document.createElement('style');
  st.textContent = '#buildbadge{position:fixed;right:6px;bottom:4px;z-index:50;margin:0;padding:2px 6px;font:11px system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.35);opacity:.6;border:0;border-radius:4px;cursor:pointer;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#buildbadge:hover{opacity:1}#buildbadge:focus-visible{opacity:1;outline:3px solid #ffd54a;outline-offset:2px}';
  document.head.appendChild(st);
  const b = document.createElement('button');
  b.type = 'button'; b.id = 'buildbadge';
  b.title = 'Tap to copy the build version for bug reports';

  label();
  let timer = 0;
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);

      const ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();

    });
  }
  b.addEventListener('click', () => {
    const text = 'Masked Spire ' + BUILD_ID + (CL.role === 'online' && CL.code ? ' \u00b7 room ' + CL.code : '');
    copyText(text).catch(() => copyText(text)).then(() => { b.textContent = 'Copied'; }, () => { b.textContent = text; });
    clearTimeout(timer);
    timer = setTimeout(label, 1500);
  });
  document.body.appendChild(b);

    fetch('/version', { cache: 'no-store' }).then(r => r.json()).then(j => {
      if (j && typeof j.build === 'string' && j.build.length < 60) { BUILD_ID = j.build; label(); }
    }).catch(() => {});
  }
})();

/* ---------- Boot ---------- */
(function boot() {
  let code = null;
  try { code = sessionStorage.getItem(CODEKEY); } catch (e) {}
  const cleanCode = s => { s = String(s || '').trim().toLowerCase(); return /^[a-z0-9]{5}$/.test(s) ? s : ''; };
  code = cleanCode(code) || null;
  const q = cleanCode(new URLSearchParams(location.search).get('room'));
  if (q) {
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
    CL.joinCode = q.toUpperCase();
    code = q;
  }
  if (code) goOnline({ t: 'join', code, tok: CL.tok });
  else render();
})();
})();
